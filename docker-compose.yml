services:
  mongo:
    image: mongo:6
    container_name: bloggers-mongo
    ports:
      - "27017:27017"
    volumes:
      - bloggers-mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  bloggers-mongo-data:
