tags:
  - name: Auth
    description: API for authentication

paths:
  /api/auth/me:
    get:
      summary: Get information about the current user
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutput"
        401:
          description: Unauthorized - access token is missing, expired or incorrect
  /api/auth/me/jwe:
    get:
      summary: Get information about the current user (JWE session token)
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutput"
        401:
          description: Unauthorized - access token is missing, expired or incorrect
  /api/auth/login:
    post:
      summary: Login with loginOrEmail and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        200:
          description: Login successful, returns JWT access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenOutput"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized - incorrect loginOrEmail or password
  /api/auth/login/jwe:
    post:
      summary: Login with loginOrEmail and password, returns a JWE session token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        200:
          description: Login successful, returns JWE session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenOutput"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized - incorrect loginOrEmail or password
  /api/auth/registration:
    post:
      summary: Register a new user and send a confirmation email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        204:
          description: Input data is accepted, confirmation email has been sent
        400:
          description: Validation error, or login/email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/auth/registration-confirmation:
    post:
      summary: Confirm registration using the code sent by email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmationInput"
      responses:
        204:
          description: Email was verified, account is activated
        400:
          description: Validation error, or confirmation code is incorrect, expired or already applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/auth/registration-email-resending:
    post:
      summary: Resend the registration confirmation email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationEmailResendingInput"
      responses:
        204:
          description: Input data is accepted, confirmation email has been re-sent
        400:
          description: Validation error, or email is already confirmed, or the current confirmation code has not expired yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthOutput:
      type: object
      required:
        - userId
        - login
        - email
      properties:
        userId:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        login:
          type: string
          example: "user1"
        email:
          type: string
          example: "user1@example.com"
    AuthInput:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          description: User's login or email
          example: "user1"
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: "qwerty1"
    AuthTokenOutput:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...."
    RegistrationConfirmationInput:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          format: uuid
          description: Confirmation code sent to the user's email
          example: "e8b8c3f0-1a2b-4c3d-9e0f-1234567890ab"
    RegistrationEmailResendingInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user1@example.com"
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: "clientName"
        message:
          type: string
          example: "Client name is required"
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
