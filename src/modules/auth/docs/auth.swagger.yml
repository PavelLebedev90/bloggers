tags:
  - name: Auth
    description: API for authentication

paths:
  /api/auth/me:
    get:
      summary: Get information about the current user
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutput"
        401:
          description: Unauthorized - access token is missing, expired or incorrect
  /api/auth/login:
    post:
      summary: Login with loginOrEmail and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        204:
          description: Login successful
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized - incorrect loginOrEmail or password

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthOutput:
      type: object
      required:
        - userId
        - login
        - email
      properties:
        userId:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        login:
          type: string
          example: "user1"
        email:
          type: string
          example: "user1@example.com"
    AuthInput:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          description: User's login or email
          example: "user1"
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: "qwerty1"
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: "clientName"
        message:
          type: string
          example: "Client name is required"
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
