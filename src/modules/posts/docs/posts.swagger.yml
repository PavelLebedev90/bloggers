paths:
  /api/posts:
    get:
      summary: Get a paginated list of posts
      tags: [Posts]
      security: []
      parameters:
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [title, createdAt, shortDescription, blogName, content]
            default: createdAt
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        200:
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPaginated"
        400:
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a new post
      tags: [Posts]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        201:
          description: Post successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

  /api/posts/{id}:
    get:
      summary: Get a post by id
      tags: [Posts]
      security: []
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      responses:
        200:
          description: The requested post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update an existing post
      tags: [Posts]
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        204:
          description: Post successfully updated
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a post
      tags: [Posts]
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      responses:
        204:
          description: Post successfully deleted
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

  /api/posts/{postId}/comments:
    get:
      summary: Get a paginated list of comments for a post
      tags: [Posts]
      security: []
      parameters:
        - in: path
          name: postId
          required: true
          description: The unique identifier of the post (MongoDB ObjectId)
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "60a7e5f8b4c7e1234567890a"
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [content, createdAt]
            default: createdAt
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        200:
          description: Paginated list of comments for the post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsPaginated"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create a new comment for a post
      tags: [Posts]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          description: The unique identifier of the post (MongoDB ObjectId)
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "60a7e5f8b4c7e1234567890a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        201:
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          description: Forbidden - the user's email is not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        404:
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PostIdPath:
      in: path
      name: id
      required: true
      description: The unique identifier of the post (MongoDB ObjectId)
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        example: "60a7e5f8b4c7e1234567890a"
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - shortDescription
        - content
        - blogId
        - blogName
        - createdAt
      properties:
        id:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        title:
          type: string
          minLength: 1
          maxLength: 30
          example: "My first post"
        shortDescription:
          type: string
          minLength: 1
          maxLength: 100
          example: "A short description of my first post"
        content:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Post content"
        blogId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: "60a7e5f8b4c7e1234567890b"
        blogName:
          type: string
          example: "Tech Blog"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
    PostInputWithoutBlogId:
      type: object
      required:
        - title
        - shortDescription
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 30
          example: "My first post"
        shortDescription:
          type: string
          minLength: 1
          maxLength: 100
          example: "A short description of my first post"
        content:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Post content"
    PostInput:
      allOf:
        - $ref: "#/components/schemas/PostInputWithoutBlogId"
        - type: object
          required:
            - blogId
          properties:
            blogId:
              type: string
              pattern: "^[0-9a-fA-F]{24}$"
              example: "60a7e5f8b4c7e1234567890b"
    PostsPaginated:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Post"
