paths:
  /api/blogs:
    get:
      summary: Get a paginated list of blogs
      tags: [Blogs]
      security: []
      parameters:
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [name, createdAt, websiteUrl, description]
            default: createdAt
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: searchNameTerm
          required: false
          description: Case-insensitive search by part of the blog name
          schema:
            type: string
      responses:
        200:
          description: Paginated list of blogs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogsPaginated"
        400:
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a new blog
      tags: [Blogs]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogInput"
      responses:
        201:
          description: Blog successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"

  /api/blogs/{id}:
    get:
      summary: Get a blog by id
      tags: [Blogs]
      security: []
      parameters:
        - $ref: "#/components/parameters/BlogId"
      responses:
        200:
          description: The requested blog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update an existing blog
      tags: [Blogs]
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/BlogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogInput"
      responses:
        204:
          description: Blog successfully updated
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a blog
      tags: [Blogs]
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/BlogId"
      responses:
        204:
          description: Blog successfully deleted
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

  /api/blogs/{blogId}/posts:
    get:
      summary: Get a paginated list of posts for a blog
      tags: [Blogs]
      security: []
      parameters:
        - in: path
          name: blogId
          required: true
          description: The unique identifier of the blog (MongoDB ObjectId)
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "60a7e5f8b4c7e1234567890a"
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [title, createdAt, shortDescription, blogName, content]
            default: createdAt
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        200:
          description: Paginated list of posts for the blog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPaginated"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create a new post for a blog
      description: blogId is taken from the path, so it must not be sent in the body.
      tags: [Blogs]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: blogId
          required: true
          description: The unique identifier of the blog (MongoDB ObjectId)
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "60a7e5f8b4c7e1234567890a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInputWithoutBlogId"
      responses:
        201:
          description: Post successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    BlogId:
      in: path
      name: id
      required: true
      description: The unique identifier of the blog (MongoDB ObjectId)
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        example: "60a7e5f8b4c7e1234567890a"
  schemas:
    Blog:
      type: object
      required:
        - id
        - name
        - description
        - websiteUrl
        - createdAt
        - isMembership
      properties:
        id:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: "Tech Blog"
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: "A blog about technology"
        websiteUrl:
          type: string
          minLength: 1
          maxLength: 100
          format: uri
          pattern: '^https://([a-zA-Z0-9_-]+\.)+[a-zA-Z0-9_-]+(\/[a-zA-Z0-9_-]+)*\/?$'
          example: "https://example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        isMembership:
          type: boolean
          example: false
    BlogInput:
      type: object
      required:
        - name
        - description
        - websiteUrl
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: "Tech Blog"
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: "A blog about technology"
        websiteUrl:
          type: string
          minLength: 1
          maxLength: 100
          format: uri
          pattern: '^https://([a-zA-Z0-9_-]+\.)+[a-zA-Z0-9_-]+(\/[a-zA-Z0-9_-]+)*\/?$'
          example: "https://example.com"
    BlogsPaginated:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Blog"
