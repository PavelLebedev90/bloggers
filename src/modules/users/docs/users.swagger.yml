paths:
  /api/users:
    get:
      summary: Get a paginated list of users
      tags: [Users]
      security:
        - BasicAuth: []
      parameters:
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [login, email, createdAt]
            default: createdAt
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: searchLoginTerm
          required: false
          description: Case-insensitive search by part of the login
          schema:
            type: string
        - in: query
          name: searchEmailTerm
          required: false
          description: Case-insensitive search by part of the email
          schema:
            type: string
      responses:
        200:
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersPaginated"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a new user
      description: The user is created already confirmed, no confirmation email is sent.
      tags: [Users]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        201:
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: Validation error, or the login/email is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          $ref: "#/components/responses/Unauthorized"

  /api/users/{id}:
    delete:
      summary: Delete a user
      tags: [Users]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user (MongoDB ObjectId)
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            example: "60a7e5f8b4c7e1234567890a"
      responses:
        204:
          description: User successfully deleted
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    User:
      type: object
      required:
        - id
        - login
        - email
        - createdAt
      properties:
        id:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        login:
          type: string
          minLength: 3
          maxLength: 10
          example: "user1"
        email:
          type: string
          format: email
          maxLength: 100
          example: "user1@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
    UserInput:
      type: object
      required:
        - login
        - password
        - email
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 10
          pattern: "^[a-zA-Z0-9_-]*$"
          description: Is lower-cased and trimmed by the server
          example: "user1"
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: "qwerty1"
        email:
          type: string
          format: email
          maxLength: 100
          pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
          description: Is lower-cased and trimmed by the server
          example: "user1@example.com"
    UsersPaginated:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
