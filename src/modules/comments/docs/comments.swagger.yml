paths:
  /api/comments/{commentId}:
    get:
      summary: Get a comment by id
      tags: [Comments]
      security: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        200:
          description: The requested comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a comment by id
      description: Only the author of the comment may update it.
      tags: [Comments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        204:
          description: Comment successfully updated
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          description: Forbidden - the comment belongs to another user, or the user's email is not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        404:
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a comment by id
      description: Only the author of the comment may delete it.
      tags: [Comments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        204:
          description: Comment successfully deleted
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          description: Forbidden - the comment belongs to another user, or the user's email is not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        404:
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    CommentId:
      in: path
      name: commentId
      required: true
      description: The unique identifier of the comment (MongoDB ObjectId)
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        example: "60a7e5f8b4c7e1234567890a"
  schemas:
    Comment:
      type: object
      required:
        - id
        - content
        - commentatorInfo
        - createdAt
      properties:
        id:
          type: string
          example: "60a7e5f8b4c7e1234567890a"
        content:
          type: string
          minLength: 20
          maxLength: 300
          example: "This is a comment with enough length to pass validation"
        commentatorInfo:
          type: object
          required:
            - userId
            - userLogin
          properties:
            userId:
              type: string
              example: "60a7e5f8b4c7e1234567890b"
            userLogin:
              type: string
              example: "user1"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
    CommentInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 20
          maxLength: 300
          example: "This is a comment with enough length to pass validation"
    CommentsPaginated:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
